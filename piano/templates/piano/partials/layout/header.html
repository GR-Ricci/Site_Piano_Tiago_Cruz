{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instituto de Piano</title>
    <!-- Seus outros links de CSS e fontes vão aqui -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
</head>
<body>

<header class="header">
    <div class="logo-container">
        <div class="logo">
            <a href="/" class="logo-link">
                <img src="{% static 'piano/images/layout/header/logo.png' %}" alt="Logo" class="logo-img">
            </a>
        </div>
    </div>

    <ul class="nav-links" id="navLinks">
        <li><a href="/" class="{% if request.path == '/' %}active{% endif %}">Inicio</a></li>
        <li><a href="/about/" class="{% if request.path == '/about/' %}active{% endif %}">Instituto</a></li>
        <li><a href="/classes/" class="{% if request.path == '/classes/' %}active{% endif %}">Cursos</a></li>
        <!-- <li><a href="/usp/" class="{% if request.path == '/usp/' %}active{% endif %}">Parceria USP</a></li> -->
        <li><a href="/contact/" class="{% if request.path == '/contact/' %}active{% endif %}">Contato</a></li>
    </ul>

    <div class="btn-container">
        <a href="https://www.instagram.com/institutodepiano/" target="_blank" class="social-icon">
            <i class="fab fa-instagram"></i>
        </a>
        <div class="divider"></div>
        <a href="https://wa.me/5516991711719" target="_blank" class="btn-contato-nav">Falar com o Professor</a>

        <!-- BOTÃO HAMBÚRGUER (agora dentro do btn-container, como último item) -->
        <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
    </div>
</header>

<!-- Restante do conteúdo da página -->

<script>
    // Código do menu hambúrguer
    document.addEventListener('DOMContentLoaded', function() {
        const toggle = document.getElementById('menuToggle');
        const navLinks = document.getElementById('navLinks');

        if (toggle && navLinks) {
            toggle.addEventListener('click', function() {
                this.classList.toggle('active');
                navLinks.classList.toggle('active');
            });

            // Fecha o menu ao clicar em um link
            navLinks.querySelectorAll('a').forEach(function(link) {
                link.addEventListener('click', function() {
                    toggle.classList.remove('active');
                    navLinks.classList.remove('active');
                });
            });
        }
    });
</script>

</body>
</html>
